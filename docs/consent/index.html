<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DentMemo Consent</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13213a;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh}.side{position:fixed;width:235px;inset:0 auto 0 0;background:white;border-right:1px solid #e5eaf2;padding:22px 16px;display:flex;flex-direction:column}.logo{display:flex;gap:9px;align-items:center;font-weight:800}.mark{width:36px;height:36px;border-radius:11px;background:#0f5bea;color:white;display:grid;place-items:center}.logo small{display:block;color:#0f5bea;font-size:10px}.clinic{padding:12px;border:1px solid #e6eaf1;border-radius:13px;margin:26px 0 16px}.clinic b,.clinic small{display:block}.clinic small,.muted{color:#778397}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;color:#566276;cursor:pointer}.nav button.active{background:#edf4ff;color:#0f5bea;font-weight:750}.bottom{margin-top:auto;font-size:11px;color:#8190a5}.main{margin-left:235px;padding:38px max(24px,calc((100vw - 235px - 1050px)/2));padding-bottom:100px}.demo{padding:10px 12px;background:#fff5df;border:1px solid #efd7a5;border-radius:11px;color:#825d19;font-size:12px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.top h1{font-size:32px;margin:4px 0}.kicker{font-size:11px;color:#0f5bea;font-weight:850;letter-spacing:.12em}.primary,.secondary,.link{cursor:pointer}.primary,.secondary{border:0;border-radius:11px;padding:11px 15px;min-height:44px;font-weight:750}.primary{background:#0f5bea;color:white}.secondary{background:white;border:1px solid #dce3ec;color:#26344b}.link{border:0;background:transparent;color:#0f5bea;font-weight:700}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.card{background:white;border:1px solid #e4e9f1;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(28,45,75,.035)}.grid3 strong{display:block;font-size:28px;margin-top:6px}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-size:12px;font-weight:700}.form input,.form select,.form textarea,.search{border:1px solid #dce3ed;border-radius:10px;padding:11px 12px;background:white;color:#14213d;width:100%;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid}.row{display:grid;grid-template-columns:38px 1fr minmax(130px,.55fr) auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #edf0f5}.row:first-child{border-top:0}.dot{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#e8f6ef;color:#158355;font-weight:800}.row b,.row span,.row small{display:block}.row span,.row small{font-size:12px;color:#788496}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:#e9f8f0;color:#14784d;font-weight:800}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.sign{height:230px;width:100%;border:1.5px solid #ccd6e4;border-radius:13px;touch-action:none;background:white}.patient{max-width:760px;margin:auto}.checks{display:grid;gap:9px;margin:14px 0}.checks label{display:flex;gap:8px;padding:12px;border:1px solid #e3e8f0;border-radius:10px}.success{text-align:center;padding:45px}.success .ok{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#e7f8ef;color:#148354;font-size:26px;margin:auto}.logoPreview{max-width:120px;max-height:70px;object-fit:contain;margin:10px 0}.mobile{display:none}@media(max-width:760px){.side{display:none}.main{margin:0;padding:20px 14px 82px}.grid3,.two,.templates{grid-template-columns:1fr}.row{grid-template-columns:34px 1fr}.row>div:nth-child(3),.row>.badge{display:none}.top{align-items:flex-start}.top h1{font-size:26px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5eaf2;justify-content:space-around;padding:7px;z-index:20}.mobile button{border:0;background:transparent;color:#667184;padding:8px;font-size:11px}}</style></head><body><div class="app"><aside class="side"><div class="logo"><div class="mark">♡</div><div><span id="brandName">DentMemo</span><small>Consent</small></div></div><div class="clinic"><b id="clinicSide">Demo Dental Clinic</b><small id="citySide">Goa</small></div><div class="nav" id="nav"></div><div class="bottom">Create · Sign · Email · Retrieve</div></aside><main class="main"><div class="demo">Demo preview only. Do not enter real patient information here.</div><div id="screen"></div></main><nav class="mobile" id="mobile"></nav></div><script>const defaults={clinic:{name:'Demo Dental Clinic',city:'Goa',address:'Aquem, Margao, Goa',phone:'+91 90000 00000',email:'clinic@example.com',logo:null},doctors:[{id:'d1',name:'Dr. Blessin Mathew',reg:'GA-1234',email:'doctor@example.com'}],templates:[{id:'t1',title:'Root Canal Treatment',key:'root_canal',text:'The proposed root canal treatment, its purpose, expected benefits, relevant risks, alternatives and the possibility of additional treatment have been explained to me. I have had the opportunity to ask questions and understand that outcomes cannot be guaranteed.',version:1,status:'approved'},{id:'t2',title:'Dental Extraction',key:'extraction',text:'The proposed extraction, expected benefits, common risks, possible complications, alternatives and post-operative instructions have been explained to me. I have had the opportunity to ask questions and agree to proceed.',version:1,status:'approved'}],records:[],audit:[{id:'a1',event:'workspace_opened',actor:'Dr. Demo',time:new Date().toISOString(),scope:'Account'}]};let state=JSON.parse(localStorage.getItem('dentmemo-consent-v2-demo')||'null')||defaults;let view='dashboard';const nav=[['dashboard','⌂ Overview'],['new','＋ New consent'],['records','▤ Records'],['templates','□ Templates'],['audit','◎ Audit'],['settings','⚙ Settings']];function save(){localStorage.setItem('dentmemo-consent-v2-demo',JSON.stringify(state));syncBrand()}function log(event,scope='Account'){state.audit.unshift({id:crypto.randomUUID(),event,actor:'Dr. Demo',time:new Date().toISOString(),scope});save()}function syncBrand(){clinicSide.textContent=state.clinic.name;citySide.textContent=state.clinic.city;brandName.textContent=state.clinic.name}function setView(v){view=v;render()}function navs(){navEl=nav.map(([id,l])=>`<button class="${view===id?'active':''}" onclick="setView('${id}')">${l}</button>`).join('');document.getElementById('nav').innerHTML=navEl;document.getElementById('mobile').innerHTML=nav.slice(0,4).map(([id,l])=>`<button onclick="setView('${id}')">${l.replace(/^. /,'')}</button>`).join('')}function render(){navs();syncBrand();const s=document.getElementById('screen');if(view==='dashboard')s.innerHTML=dashboard();if(view==='records')s.innerHTML=records();if(view==='templates')s.innerHTML=templates();if(view==='audit')s.innerHTML=audit();if(view==='settings')s.innerHTML=settings();if(view==='new')s.innerHTML=newConsent()}function top(k,h,p,b=''){return `<div class="top"><div><div class="kicker">${k}</div><h1>${h}</h1><p class="muted">${p}</p></div>${b}</div>`}function dashboard(){return top('DENTMEMO CONSENT',state.clinic.name,'Create, sign, email and retrieve dental consent records.','<button class="primary" onclick="setView(\'new\')">+ New Consent</button>')+`<div class="grid3"><div class="card"><small>Signed today</small><strong>${state.records.length}</strong></div><div class="card"><small>Stored records</small><strong>${state.records.length}</strong></div><div class="card"><small>Templates ready</small><strong>${state.templates.filter(t=>t.status==='approved').length}</strong></div></div><div class="card"><h2>Recent consents</h2><p class="muted">Recovery archive if the original email is deleted.</p>${recordRows(state.records.slice(0,5))}</div>`}function recordRows(rows){if(!rows.length)return '<div class="success"><p class="muted">No signed consents yet.</p></div>';return `<div class="list">${rows.map(r=>`<div class="row"><div class="dot">✓</div><div><b>${r.patient}</b><span>${r.template} · ${r.doctor}</span></div><div><b>${r.id}</b><small>${new Date(r.time).toLocaleString()}</small></div><span class="badge">Emailed</span></div>`).join('')}</div>`}function records(){return top('RECORDS','Consent archive','Signed consent backups remain retrievable.')+`<input class="search" placeholder="Search patient, consent ID or doctor" oninput="filterRecords(this.value)"><div class="card" id="recordBox">${recordRows(state.records)}</div>`}function filterRecords(q){const x=q.toLowerCase();document.getElementById('recordBox').innerHTML=recordRows(state.records.filter(r=>(r.patient+r.id+r.doctor+r.template).toLowerCase().includes(x)))}function templates(){return top('TEMPLATES','Consent templates','Create clinic-specific forms. Changes create new versions, never rewrite history.','<button class="primary" onclick="showTemplateForm()">+ New template</button>')+`<div id="templateForm"></div><div class="templates">${state.templates.map(t=>`<div class="card"><div class="kicker">${t.key.toUpperCase()}</div><h2>${t.title}</h2><p class="muted">${t.text}</p><p><span class="badge">v${t.version} · ${t.status}</span></p><button class="secondary" onclick="newVersion('${t.id}')">Create new version</button></div>`).join('')}</div>`}function showTemplateForm(base){const t=base?state.templates.find(x=>x.id===base):null;document.getElementById('templateForm').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>${t?'Create new version':'Create template'}</h2><form class="form" onsubmit="saveTemplate(event,'${t?t.id:''}')"><div class="two"><label>Template name<input id="tt" required value="${t?t.title:''}"></label><label>Procedure key<input id="tk" required value="${t?t.key:''}" ${t?'readonly':''}></label></div><label>Consent wording<textarea id="tx" rows="7" minlength="40" required>${t?t.text:''}</textarea></label><div class="actions"><button class="primary">Save</button><button type="button" class="secondary" onclick="render()">Cancel</button></div></form></div>`}function newVersion(id){showTemplateForm(id)}function saveTemplate(e,id){e.preventDefault();const old=state.templates.find(x=>x.id===id);state.templates.push({id:crypto.randomUUID(),title:tt.value,key:tk.value,text:tx.value,version:old?old.version+1:1,status:'approved'});log(old?'template_version_created':'template_created');render()}function audit(){return top('AUDIT','Activity log','Who did what, and when. Audit rows are append-only.')+`<div class="card"><div class="list">${state.audit.map(a=>`<div class="row"><div class="dot">•</div><div><b>${a.event.replaceAll('_',' ')}</b><span>${a.actor}</span></div><div><b>${new Date(a.time).toLocaleDateString()}</b><small>${new Date(a.time).toLocaleTimeString()}</small></div><span class="badge">${a.scope}</span></div>`).join('')}</div></div>`}function settings(){return top('SETTINGS','Clinic identity & doctors','These details identify the clinic and treating doctor on consent workflows.')+`<div class="two"><div class="card"><h2>Clinic profile</h2>${state.clinic.logo?`<img class="logoPreview" src="${state.clinic.logo}">`:''}<form class="form" onsubmit="saveClinic(event)"><label>Clinic logo<input type="file" accept="image/*" onchange="previewLogo(this.files[0])"></label><label>Clinic name<input id="cn" value="${state.clinic.name}" required></label><div class="two"><label>City<input id="cc" value="${state.clinic.city}"></label><label>Phone<input id="cp" value="${state.clinic.phone}"></label></div><label>Address<textarea id="ca">${state.clinic.address}</textarea></label><label>Clinic email<input id="ce" type="email" value="${state.clinic.email}"></label><button class="primary">Save clinic profile</button></form></div><div class="card"><h2>Doctors</h2><div class="list">${state.doctors.map(d=>`<div class="row"><div class="dot">${d.name[0]}</div><div><b>${d.name}</b><span>${d.reg} · ${d.email}</span></div><button class="link" onclick="editDoctor('${d.id}')">Edit</button></div>`).join('')}</div><div id="doctorForm"><button class="secondary" onclick="editDoctor('')">+ Add doctor</button></div></div></div><div class="card" style="margin-top:14px"><h2>Workspace users</h2><p class="muted">Each person should have an individual login in the live product so actions can be attributed correctly.</p><div class="row"><div class="dot">D</div><div><b>Dr. Demo</b><span>Owner</span></div><span class="badge">Active</span></div></div>`}function previewLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{state.clinic.logo=r.result;log('clinic_logo_updated');render()};r.readAsDataURL(f)}function saveClinic(e){e.preventDefault();state.clinic={...state.clinic,name:cn.value,city:cc.value,address:ca.value,phone:cp.value,email:ce.value};log('clinic_profile_updated');render()}function editDoctor(id){const d=state.doctors.find(x=>x.id===id);document.getElementById('doctorForm').innerHTML=`<form class="form" onsubmit="saveDoctorDemo(event,'${id}')"><label>Doctor name<input id="dn" required value="${d?d.name:''}"></label><label>Registration number<input id="dr" value="${d?d.reg:''}"></label><label>Email for signed PDFs<input id="de" type="email" required value="${d?d.email:''}"></label><button class="primary">Save doctor</button></form>`}function saveDoctorDemo(e,id){e.preventDefault();const d=state.doctors.find(x=>x.id===id);if(d){d.name=dn.value;d.reg=dr.value;d.email=de.value;log('doctor_updated')}else{state.doctors.push({id:crypto.randomUUID(),name:dn.value,reg:dr.value,email:de.value});log('doctor_created')}render()}function newConsent(){return top('NEW CONSENT','Patient & treatment','Enter the essentials, then review and sign.')+`<div class="card"><form class="form" onsubmit="reviewConsent(event)"><div class="two"><label>Patient name<input id="pn" required></label><label>Mobile<input id="pm"></label></div><div class="two"><label>Treating doctor<select id="pd">${state.doctors.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select></label><label>Consent template<select id="pt">${state.templates.filter(t=>t.status==='approved').map(t=>`<option value="${t.id}">${t.title} · v${t.version}</option>`).join('')}</select></label></div><label>Tooth number(s)<input id="tooth"></label><button class="primary">Review Consent →</button></form></div><div id="patientStage"></div>`}function reviewConsent(e){e.preventDefault();const d=state.doctors.find(x=>x.id===pd.value),t=state.templates.find(x=>x.id===pt.value);window.current={patient:pn.value,mobile:pm.value,doctor:d,template:t,tooth:tooth.value};document.getElementById('patientStage').innerHTML=`<div class="card patient" style="margin-top:15px"><div class="kicker">PATIENT REVIEW</div><h2>${t.title}</h2><p><b>${pn.value}</b> · ${d.name}${tooth.value?' · Tooth '+tooth.value:''}</p><p class="muted">${t.text}</p><div class="checks"><label><input type="checkbox" id="a1"> I have read and understood the information above.</label><label><input type="checkbox" id="a2"> I have had an opportunity to ask questions.</label></div><h3>Patient signature</h3><canvas id="sig" class="sign"></canvas><div class="actions"><button class="secondary" onclick="clearSig()">Clear</button><button class="primary" onclick="completeConsent()">Accept & Submit</button></div></div>`;setupSig()}let drawing=false,hasInk=false;function setupSig(){const c=document.getElementById('sig'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';const p=e=>{const r=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return[x,y]};const start=e=>{drawing=true;hasInk=true;ctx.beginPath();ctx.moveTo(...p(e));e.preventDefault()};const move=e=>{if(!drawing)return;ctx.lineTo(...p(e));ctx.stroke();e.preventDefault()};const end=()=>drawing=false;c.onpointerdown=start;c.onpointermove=move;c.onpointerup=end;c.onpointerleave=end}function clearSig(){const c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height);hasInk=false}function completeConsent(){if(!a1.checked||!a2.checked||!hasInk)return alert('Please complete acknowledgements and signature.');const id='DC-'+new Date().getFullYear()+'-'+Math.random().toString(16).slice(2,8).toUpperCase();state.records.unshift({id,patient:current.patient,doctor:current.doctor.name,template:current.template.title,time:new Date().toISOString()});log('consent_signed','Consent');log('email_sent','Consent');save();document.getElementById('screen').innerHTML=`<div class="card success"><div class="ok">✓</div><h1>${id}</h1><h2>${current.patient}</h2><p class="muted">Signed, backed up and marked emailed in this demo.</p><button class="primary" onclick="setView('records')">View Records</button></div>`}syncBrand();render();</script></body></html>
