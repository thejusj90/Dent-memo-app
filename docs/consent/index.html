<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f7f9fc" />
<title>DentMemo Consent</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13213a;background:#f7f9fc;line-height:1.45}*{box-sizing:border-box}body{margin:0;background:#f7f9fc}button,input,select,textarea{font:inherit}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:#fff;border-right:1px solid #e5eaf2;padding:22px 18px;display:flex;flex-direction:column}.logo{display:flex;gap:10px;align-items:center;font-weight:800;color:#14213d}.logo-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#0f5bea;color:#fff}.logo small{display:block;color:#0f5bea;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.clinic{margin:28px 0 18px;padding:12px;border:1px solid #e7ebf2;border-radius:14px}.clinic b,.clinic small{display:block}.clinic small{color:#7a8596;margin-top:3px}.nav{display:grid;gap:5px}.nav button,.bottom button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#566276;cursor:pointer}.nav button.active{background:#eef4ff;color:#0f5bea;font-weight:750}.bottom{margin-top:auto;display:grid;gap:8px}.workspace{margin-left:240px;padding:42px max(28px,calc((100vw - 240px - 1040px)/2));padding-bottom:100px}.preview{background:#fff7e7;border:1px solid #f0d9aa;color:#855d12;padding:11px 13px;border-radius:11px;font-size:12px;margin-bottom:20px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.kicker{margin:0;color:#0f5bea;font-size:11px;font-weight:850;letter-spacing:.12em}.top h1{font-size:32px;letter-spacing:-1px;margin:5px 0}.muted{color:#748094;margin:0}.primary,.secondary,.link{cursor:pointer}.primary,.secondary{border:0;border-radius:11px;padding:11px 16px;font-weight:750;min-height:44px}.primary{background:#0f5bea;color:#fff}.secondary{background:#fff;border:1px solid #dce2ec;color:#26344b}.link{border:0;background:transparent;color:#0f5bea;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(28,45,75,.035)}.metrics small{color:#7a8596}.metrics strong{display:block;font-size:28px;margin-top:7px}.records{display:grid}.record{display:grid;grid-template-columns:40px minmax(160px,1fr) minmax(140px,.7fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #edf0f5}.record:first-child{border-top:0}.tick{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e7f8ef;color:#168554;font-weight:900}.record b,.record span,.record small{display:block}.record span,.record small{font-size:12px;color:#788496;margin-top:3px}.status{font-size:11px;background:#e9f8f0;color:#14784d;padding:6px 9px;border-radius:999px}.form{display:grid;gap:14px;max-width:820px}.form label{display:grid;gap:7px;font-size:12px;font-weight:700;color:#46536a}.form input,.form select,.form textarea{border:1px solid #dce3ed;border-radius:10px;padding:11px 12px;background:#fff;color:#14213d;min-height:44px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.document{max-width:760px;margin:20px auto;background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:34px;box-shadow:0 12px 36px rgba(20,36,64,.06)}.document h1{font-size:28px}.copy{font-size:16px;line-height:1.75;color:#2b3850;padding:10px 0 18px}.acks{display:grid;gap:10px;margin:18px 0}.acks label{display:flex;gap:10px;padding:13px;border:1px solid #e3e8f0;border-radius:11px}.acks input{width:19px;height:19px;accent-color:#0f5bea}.signbox{border:1.5px solid #cfd8e6;border-radius:14px;overflow:hidden;background:#fff;margin:18px 0}.signbox canvas{display:block;width:100%;height:250px;touch-action:none}.signfoot{display:flex;justify-content:space-between;padding:9px 12px;border-top:1px solid #edf0f5;font-size:11px;color:#8490a1}.success{text-align:center;max-width:650px;margin:50px auto}.success .big{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e6f8ee;color:#118354;font-size:28px;font-weight:900;margin:0 auto 14px}.empty{text-align:center;color:#7b8798;padding:38px 10px}.mobile{display:none}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.search{width:100%;border:1px solid #dfe5ee;border-radius:12px;padding:12px 14px;margin-bottom:14px}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.template h2{margin:5px 0 8px}.template p{font-size:13px;color:#647186}.badge{display:inline-block;font-size:10px;padding:5px 8px;border-radius:999px;background:#e7f8ef;color:#137d4e;font-weight:800}.notice{font-size:12px;color:#7a8596;margin-top:14px}@media(max-width:760px){.sidebar{display:none}.workspace{margin:0;padding:22px 16px 90px}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4e9f1;z-index:20;justify-content:space-around;padding:8px}.mobile button{border:0;background:transparent;color:#667184;padding:8px;font-size:12px}.metrics,.two,.templates{grid-template-columns:1fr}.record{grid-template-columns:36px 1fr}.record>div:nth-child(3),.record>.status{display:none}.top{align-items:flex-start}.top h1{font-size:26px}.document{padding:22px;margin:10px 0}.signbox canvas{height:220px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">♡</span><div>DentMemo<small>Consent</small></div></div>
    <div class="clinic"><b>DentMemo Demo Clinic</b><small>Goa · Preview workspace</small></div>
    <div class="nav">
      <button data-view="dashboard" class="active">⌂ Overview</button>
      <button data-view="new">＋ New consent</button>
      <button data-view="records">▤ Records</button>
      <button data-view="templates">□ Templates</button>
    </div>
    <div class="bottom"><small class="muted">No payment or subscription required.</small></div>
  </aside>
  <main class="workspace">
    <div class="preview"><b>Preview mode:</b> use sample data only. This page is for trying the Consent experience and does not send or securely store real patient records.</div>
    <section id="dashboard"></section>
    <section id="new" class="hidden"></section>
    <section id="records" class="hidden"></section>
    <section id="templates" class="hidden"></section>
  </main>
  <nav class="mobile">
    <button data-view="dashboard">Overview</button><button data-view="new">New</button><button data-view="records">Records</button><button data-view="templates">Templates</button>
  </nav>
</div>
<script>
const templates=[
 {id:'rct',title:'Root Canal Treatment',text:'The proposed root canal treatment, its purpose, expected benefits, relevant risks, alternatives and the possibility of additional treatment have been explained to me. I have had the opportunity to ask questions and understand that outcomes cannot be guaranteed.'},
 {id:'extraction',title:'Dental Extraction',text:'The proposed extraction, expected benefits, common risks, possible complications, alternatives and post-operative instructions have been explained to me. I have had the opportunity to ask questions and agree to proceed.'},
 {id:'implant',title:'Dental Implant',text:'The proposed implant procedure, expected benefits, healing process, relevant risks, alternatives and possibility of additional procedures have been explained to me. I have had an opportunity to ask questions.'},
 {id:'photo',title:'Dental Photography / Media',text:'The purpose and intended use of clinical photographs or media have been explained to me, including whether the material is for clinical documentation, education or another approved purpose.'}
];
let records=JSON.parse(localStorage.getItem('dentmemo-consent-preview')||'[]');
let state={step:'details',draft:{name:'',mobile:'',dob:'',template:'rct',tooth:'',notes:'',guardian:false,guardianName:'',relationship:''},signed:false};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem('dentmemo-consent-preview',JSON.stringify(records));}
function go(view){document.querySelectorAll('main.workspace>section').forEach(s=>s.classList.add('hidden'));document.getElementById(view).classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='dashboard')renderDashboard();if(view==='records')renderRecords();if(view==='templates')renderTemplates();if(view==='new'){state.step='details';renderNew();}}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
function renderDashboard(){const d=document.getElementById('dashboard');const today=new Date().toDateString();const month=new Date().getMonth();const signedToday=records.filter(r=>new Date(r.date).toDateString()===today).length;const signedMonth=records.filter(r=>new Date(r.date).getMonth()===month).length;d.innerHTML=`<div class="top"><div><p class="kicker">DENTMEMO CONSENT</p><h1>Dental consent, without paperwork.</h1><p class="muted">A separate Consent workspace — not the DentMemo patient-memory feature screen.</p></div><button class="primary" onclick="go('new')">+ New Consent</button></div><div class="metrics"><div class="card"><small>Signed today</small><strong>${signedToday}</strong></div><div class="card"><small>Signed this month</small><strong>${signedMonth}</strong></div><div class="card"><small>Templates ready</small><strong>${templates.length}</strong></div></div><div class="card"><div class="top" style="margin-bottom:8px"><div><h2 style="margin:0">Recent consents</h2><p class="muted">Preview records are stored only in this browser.</p></div><button class="link" onclick="go('records')">View all</button></div>${records.length?recordRows(records.slice(0,6)):'<div class="empty">No signed consents yet. Create one to test the flow.</div>'}</div>`}
function recordRows(list){return `<div class="records">${list.map(r=>`<div class="record"><div class="tick">✓</div><div><b>${esc(r.name)}</b><span>${esc(r.procedure)}${r.tooth?' · Tooth '+esc(r.tooth):''}</span></div><div><b>${esc(r.id)}</b><small>${new Date(r.date).toLocaleString('en-IN')}</small></div><span class="status">Signed</span></div>`).join('')}</div>`}
function renderRecords(){const d=document.getElementById('records');d.innerHTML=`<div class="top"><div><p class="kicker">ARCHIVE</p><h1>Consent records</h1><p class="muted">Local preview records only.</p></div></div><input class="search" id="q" placeholder="Search patient, consent ID or procedure"><div class="card" id="recordList"></div>`;const draw=()=>{const q=document.getElementById('q').value.toLowerCase();const f=records.filter(r=>(r.name+' '+r.id+' '+r.procedure).toLowerCase().includes(q));document.getElementById('recordList').innerHTML=f.length?recordRows(f):'<div class="empty">No matching consents.</div>'};document.getElementById('q').addEventListener('input',draw);draw();}
function renderTemplates(){document.getElementById('templates').innerHTML=`<div class="top"><div><p class="kicker">CLINIC FORMS</p><h1>Consent templates</h1><p class="muted">Sample wording for interface testing. Clinic review is required before real use.</p></div></div><div class="templates">${templates.map(t=>`<article class="card template"><span class="badge">PREVIEW READY</span><h2>${esc(t.title)}</h2><p>${esc(t.text)}</p></article>`).join('')}</div>`}
function renderNew(){const d=document.getElementById('new');const x=state.draft;if(state.step==='details'){d.innerHTML=`<div class="top"><div><p class="kicker">NEW CONSENT</p><h1>Patient & treatment</h1><p class="muted">Enter sample details, then hand the device to the patient.</p></div><button class="link" onclick="go('dashboard')">Cancel</button></div><div class="card"><form class="form" id="detailsForm"><h2>Patient</h2><div class="two"><label>Patient name<input id="name" required value="${esc(x.name)}"></label><label>Mobile<input id="mobile" value="${esc(x.mobile)}"></label></div><label>Date of birth<input id="dob" type="date" value="${esc(x.dob)}"></label><h2>Treatment</h2><div class="two"><label>Treating doctor<select disabled><option>Dr. Blessin Mathew</option></select></label><label>Consent template<select id="template">${templates.map(t=>`<option value="${t.id}" ${x.template===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label></div><div class="two"><label>Tooth number(s)<input id="tooth" placeholder="e.g. 16, 17" value="${esc(x.tooth)}"></label><label>Procedure notes<input id="notes" value="${esc(x.notes)}"></label></div><button class="primary">Review Consent →</button></form></div>`;document.getElementById('detailsForm').onsubmit=e=>{e.preventDefault();x.name=document.getElementById('name').value.trim();x.mobile=document.getElementById('mobile').value.trim();x.dob=document.getElementById('dob').value;x.template=document.getElementById('template').value;x.tooth=document.getElementById('tooth').value.trim();x.notes=document.getElementById('notes').value.trim();state.step='review';renderNew();};return}
const t=templates.find(t=>t.id===x.template)||templates[0];if(state.step==='review'){d.innerHTML=`<article class="document"><button class="link" onclick="state.step='details';renderNew()">← Back</button><p class="kicker">PATIENT REVIEW</p><h1>${esc(t.title)}</h1><div class="two"><div><small>Patient</small><b>${esc(x.name)}</b></div><div><small>Treating doctor</small><b>Dr. Blessin Mathew</b></div></div><div class="copy">${esc(t.text)}</div><div class="acks"><label><input id="a1" type="checkbox">I have read and understood the information above.</label><label><input id="a2" type="checkbox">I have had an opportunity to ask questions about the proposed treatment.</label></div><label style="display:flex;gap:8px;margin:12px 0"><input id="guardian" type="checkbox"> Parent / guardian is signing</label><button class="primary" id="continue" disabled>Continue to Sign</button></article>`;const check=()=>document.getElementById('continue').disabled=!(document.getElementById('a1').checked&&document.getElementById('a2').checked);document.getElementById('a1').onchange=check;document.getElementById('a2').onchange=check;document.getElementById('continue').onclick=()=>{x.guardian=document.getElementById('guardian').checked;state.step='sign';renderNew();};return}
if(state.step==='sign'){d.innerHTML=`<article class="document"><button class="link" onclick="state.step='review';renderNew()">← Back</button><p class="kicker">PATIENT SIGNATURE</p><h1>${x.guardian?'Parent / guardian signature':'Please sign below'}</h1>${x.guardian?'<div class="two"><label>Guardian name<input id="gname"></label><label>Relationship<input id="rel"></label></div>':''}<div class="signbox"><canvas id="sig"></canvas><div class="signfoot"><span>Use finger, stylus or mouse</span><button class="link" id="clear">Clear</button></div></div><button class="primary" id="submit" disabled>Accept & Submit</button><p class="notice">Preview only. Do not enter real patient data here.</p></article>`;setupSignature();return}
if(state.step==='success'){const r=records[0];d.innerHTML=`<div class="card success"><div class="big">✓</div><p class="kicker">CONSENT COMPLETED</p><h1>${esc(r.id)}</h1><h2>${esc(r.name)}</h2><p class="muted">${esc(r.procedure)}</p><div class="actions" style="justify-content:center;margin-top:22px"><button class="primary" onclick="go('records')">View Records</button><button class="secondary" onclick="state.step='details';renderNew()">New Consent</button></div></div>`}}
function setupSignature(){const canvas=document.getElementById('sig'),ctx=canvas.getContext('2d'),submit=document.getElementById('submit');let drawing=false,hasInk=false;function size(){const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#14213d'}size();const p=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};canvas.onpointerdown=e=>{drawing=true;hasInk=true;submit.disabled=false;canvas.setPointerCapture(e.pointerId);const a=p(e);ctx.beginPath();ctx.moveTo(a.x,a.y)};canvas.onpointermove=e=>{if(!drawing)return;const a=p(e);ctx.lineTo(a.x,a.y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false;submit.disabled=true};submit.onclick=()=>{if(!hasInk)return;if(state.draft.guardian){state.draft.guardianName=(document.getElementById('gname')||{}).value||'';state.draft.relationship=(document.getElementById('rel')||{}).value||'';if(!state.draft.guardianName.trim()||!state.draft.relationship.trim()){alert('Enter guardian name and relationship.');return}}const t=templates.find(t=>t.id===state.draft.template)||templates[0];records.unshift({id:'DC-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase(),name:state.draft.name,procedure:t.title,tooth:state.draft.tooth,date:new Date().toISOString()});save();state.step='success';renderNew()}}
renderDashboard();renderRecords();renderTemplates();go('dashboard');
</script>
</body>
</html>
