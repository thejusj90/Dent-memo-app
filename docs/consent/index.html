<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DentMemo Consent</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213d;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card,.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;box-shadow:0 8px 28px rgba(31,45,70,.06)}.auth-card{width:min(430px,100%);padding:28px}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;background:#0f5bea;color:white;display:grid;place-items:center}.brand small{display:block;color:#0f5bea;font-size:10px}.kicker{color:#0f5bea;font-size:11px;font-weight:850;letter-spacing:.12em}.muted{color:#7a8799}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-size:12px;font-weight:700}.form input,.form textarea,.form select,.search{width:100%;border:1px solid #dbe3ee;border-radius:11px;padding:11px 12px;background:#fff;color:#14213d}.primary,.secondary,.link{cursor:pointer}.primary,.secondary{min-height:44px;border-radius:11px;padding:10px 15px;font-weight:750}.primary{border:0;background:#0f5bea;color:white}.secondary{background:white;border:1px solid #dbe3ee;color:#24324b}.link{border:0;background:transparent;color:#0f5bea;font-weight:700}.alert{padding:11px 13px;border-radius:10px;background:#fff3e6;color:#8b5c1b;border:1px solid #f0d4ad}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#fff;border-right:1px solid #e5eaf2;padding:22px 16px;display:flex;flex-direction:column}.clinic{margin:24px 0 14px;padding:12px;border:1px solid #e7ebf2;border-radius:13px}.clinic b,.clinic small{display:block}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;color:#5d697b}.nav button.active{background:#edf4ff;color:#0f5bea;font-weight:750}.bottom{margin-top:auto;font-size:11px;color:#8491a3}.main{margin-left:240px;padding:38px max(24px,calc((100vw - 240px - 1050px)/2));padding-bottom:90px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.top h1{font-size:32px;margin:4px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}.card{padding:20px}.grid3 strong{font-size:29px;display:block;margin-top:7px}.list{display:grid}.row{display:grid;grid-template-columns:38px 1fr minmax(150px,.55fr) auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #edf0f5}.row:first-child{border-top:0}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8f6ef;color:#168257;font-weight:800}.row b,.row span,.row small{display:block}.row span,.row small{font-size:12px;color:#7a8799}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:#eaf8f1;color:#14774e;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.canvas{width:100%;height:230px;border:1.5px solid #ccd6e4;border-radius:13px;background:#fff;touch-action:none}.mobile{display:none}.logo-preview{max-width:120px;max-height:72px;object-fit:contain;margin:10px 0}@media(max-width:760px){.side{display:none}.main{margin:0;padding:20px 14px 82px}.grid3,.two,.templates{grid-template-columns:1fr}.row{grid-template-columns:34px 1fr}.row>div:nth-child(3),.row>.badge{display:none}.top{align-items:flex-start}.top h1{font-size:27px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5eaf2;justify-content:space-around;padding:7px;z-index:20}.mobile button{border:0;background:transparent;color:#667184;padding:8px;font-size:11px}}</style></head><body><div id="app"><div class="auth"><div class="auth-card"><div class="brand"><div class="mark">♡</div><div>DentMemo<small>Consent</small></div></div><p class="muted">Loading secure workspace…</p></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.112.3';const s=createClient('https://qcwsmepvucxtqgqohuqe.supabase.co','sb_publishable_O9bkwJ1Qq3Kvpf2w7oS1zQ_bDAMe-sk',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let session=null,ctx=null,view='dashboard',drawn=[],drawing=false;const $=id=>document.getElementById(id),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function auth(note=''){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand"><div class="mark">♡</div><div>DentMemo<small>Consent</small></div></div><p class="kicker">DIGITAL DENTAL CONSENT</p><h1>Create. Sign. Email. Retrieve.</h1><p class="muted">Standalone consent records for dental clinics.</p>${note?`<div class="alert">${e(note)}</div>`:''}<form class="form" id="login"><label>Email<input id="em" type="email" required></label><label>Password<input id="pw" type="password" minlength="8" required></label><button class="primary">Sign in</button></form><button class="link" id="signup">New clinic? Create an account</button></div></div>`;login.onsubmit=async ev=>{ev.preventDefault();const{error}=await s.auth.signInWithPassword({email:em.value,password:pw.value});if(error)return auth(error.message);boot()};signup.onclick=signUpUI}function signUpUI(){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand"><div class="mark">♡</div><div>DentMemo<small>Consent</small></div></div><p class="kicker">CREATE WORKSPACE</p><h1>Start Consent.</h1><form class="form" id="su"><label>Your name<input id="fn" required></label><label>Email<input id="em" type="email" required></label><label>Password<input id="pw" type="password" minlength="8" required></label><button class="primary">Create account</button></form><button class="link" id="back">Back to sign in</button></div></div>`;su.onsubmit=async ev=>{ev.preventDefault();const{data,error}=await s.auth.signUp({email:em.value,password:pw.value,options:{data:{full_name:fn.value,requested_role:'owner'}}});if(error)return auth(error.message);if(!data.session)return auth('Check your email to confirm your account, then sign in.');boot()};back.onclick=()=>auth()}async function load(){const u=session.user,{data:m,error:me}=await s.from('dm_clinic_members').select('clinic_id,role,display_name').eq('user_id',u.id).eq('active',true).limit(1).maybeSingle();if(me)throw me;if(!m)return null;const id=m.clinic_id,[c,d,t,r,a,ms]=await Promise.all([s.from('dm_clinics').select('id,name,city,consent_logo_path,consent_address,consent_phone,consent_email').eq('id',id).single(),s.from('dm_consent_doctor_settings').select('*').eq('clinic_id',id).eq('active',true).order('doctor_name'),s.from('dm_consent_templates').select('*').or(`clinic_id.is.null,clinic_id.eq.${id}`).eq('active',true).order('display_title'),s.from('dm_consents').select('*').eq('clinic_id',id).order('created_at',{ascending:false}).limit(500),s.from('dm_consent_audit_events').select('*').eq('clinic_id',id).order('created_at',{ascending:false}).limit(500),s.from('dm_clinic_members').select('user_id,role,display_name,active').eq('clinic_id',id)]);for(const x of[c,d,t,r,a,ms])if(x.error)throw x.error;let logo=null;if(c.data.consent_logo_path){const z=await s.storage.from('dm-consent-branding').createSignedUrl(c.data.consent_logo_path,3600);logo=z.data?.signedUrl||null}return{clinicId:id,role:m.role,displayName:m.display_name,clinic:c.data,doctors:d.data||[],templates:t.data||[],records:r.data||[],audit:a.data||[],members:ms.data||[],logo}}async function boot(){const{data}=await s.auth.getSession();session=data.session;if(!session)return auth();try{ctx=await load();if(!ctx)return setup();render()}catch(x){auth(x.message||'Could not load workspace.')}}function setup(){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand"><div class="mark">♡</div><div>DentMemo<small>Consent</small></div></div><p class="kicker">ONE-TIME SETUP</p><h1>Create your clinic workspace.</h1><form class="form" id="st"><label>Clinic name<input id="cn" required></label><label>City<input id="cc" value="Goa"></label><button class="primary">Continue</button></form></div></div>`;st.onsubmit=async ev=>{ev.preventDefault();const{error}=await s.from('dm_clinics').insert({owner_user_id:session.user.id,name:cn.value.trim(),city:cc.value.trim()||null});if(error)return alert(error.message);ctx=await load();render()}}const top=(k,h,p,b='')=>`<div class="top"><div><div class="kicker">${k}</div><h1>${e(h)}</h1><p class="muted">${e(p)}</p></div>${b}</div>`;function shell(content){const n=[['dashboard','⌂ Overview'],['new','＋ New consent'],['records','▤ Records'],['templates','□ Templates'],['audit','◎ Audit'],['settings','⚙ Settings']];app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="mark">♡</div><div>${e(ctx.clinic.name)}<small>Consent</small></div></div><div class="clinic"><b>${e(ctx.clinic.name)}</b><small>${e(ctx.clinic.city||'Clinic workspace')}</small></div><div class="nav">${n.map(([i,l])=>`<button data-v="${i}" class="${view===i?'active':''}">${l}</button>`).join('')}</div><div class="bottom"><button class="link" id="logout">Sign out</button><br>Signed · Emailed · Retrievable</div></aside><main class="main">${content}</main><nav class="mobile">${n.slice(0,4).map(([i,l])=>`<button data-v="${i}">${l.replace(/^. /,'')}</button>`).join('')}</nav></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});logout.onclick=async()=>{await s.auth.signOut();auth()}}function rows(rs){return rs.length?`<div class="list">${rs.map(r=>`<div class="row"><div class="dot">${r.status==='voided'?'×':'✓'}</div><div><b>${e(r.patient_name_snapshot)}</b><span>${e(r.procedure_name_snapshot)} · ${e(r.doctor_name_snapshot)}</span></div><div><b>${e(r.consent_number)}</b><small>${r.signed_at?new Date(r.signed_at).toLocaleString('en-IN'):'—'}</small></div><span class="badge">${e(r.email_status||r.status)}</span></div>`).join('')}</div>`:'<p class="muted">No signed consents yet.</p>'}function dashboard(){const now=new Date(),today=now.toDateString(),td=ctx.records.filter(r=>r.signed_at&&new Date(r.signed_at).toDateString()===today).length,mo=ctx.records.filter(r=>{if(!r.signed_at)return false;const d=new Date(r.signed_at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;return top('DENTMEMO CONSENT',ctx.clinic.name,'Create, sign, email and retrieve dental consent records.','<button class="primary" id="newBtn">+ New Consent</button>')+`<div class="grid3"><div class="card"><small>Signed today</small><strong>${td}</strong></div><div class="card"><small>Signed this month</small><strong>${mo}</strong></div><div class="card"><small>Templates ready</small><strong>${ctx.templates.filter(t=>t.approval_status==='approved').length}</strong></div></div><div class="card"><h2>Recent consents</h2><p class="muted">Recovery archive if the original email is deleted.</p>${rows(ctx.records.slice(0,6))}</div>`}function records(){return top('RECORDS','Consent archive','Signed PDF backups remain retrievable.')+`<input class="search" id="q" placeholder="Search patient, consent ID, doctor or procedure"><div class="card" id="rb" style="margin-top:14px">${recordRows(ctx.records)}</div>`}function recordRows(rs){return rs.length?`<div class="list">${rs.map(r=>`<div class="row"><div class="dot">${r.status==='voided'?'×':'✓'}</div><div><b>${e(r.patient_name_snapshot)}</b><span>${e(r.procedure_name_snapshot)} · ${e(r.doctor_name_snapshot)}</span></div><div><b>${e(r.consent_number)}</b><small>${e(r.email_status)}</small></div><div class="actions"><button class="link" data-pdf="${r.id}">PDF</button>${r.status==='signed'?`<button class="link" data-mail="${r.id}">Resend</button>`:''}</div></div>`).join('')}</div>`:'<p class="muted">No records yet.</p>'}function templates(){return top('TEMPLATES','Consent templates','Create clinic-specific forms. Existing signed records keep their original wording.',ctx.role==='owner'?'<button class="primary" id="nt">+ New template</button>':'')+`<div id="tf"></div><div class="templates">${ctx.templates.map(t=>`<div class="card"><div class="kicker">${e(t.procedure_key.toUpperCase())}</div><h2>${e(t.display_title)}</h2><p class="muted">${e(t.consent_text)}</p><span class="badge">v${t.version} · ${e(t.approval_status)}</span>${ctx.role==='owner'?`<div class="actions" style="margin-top:12px">${t.approval_status!=='approved'?`<button class="secondary" data-ap="${t.id}">Approve</button>`:''}${t.clinic_id===ctx.clinicId?`<button class="link" data-ver="${t.id}">New version</button>`:''}</div>`:''}</div>`).join('')}</div>`}function audit(){return top('AUDIT','Activity log','Who did what, and when.')+`<div class="card">${ctx.audit.length?`<div class="list">${ctx.audit.map(a=>`<div class="row"><div class="dot">•</div><div><b>${e((a.event_type||'').replaceAll('_',' '))}</b><span>${e(a.actor_display_name||'System')}</span></div><div><b>${new Date(a.created_at).toLocaleDateString('en-IN')}</b><small>${new Date(a.created_at).toLocaleTimeString('en-IN')}</small></div><span class="badge">${a.consent_id?'Consent':'Account'}</span></div>`).join('')}</div>`:'<p class="muted">No audit events yet.</p>'}</div>`}function settings(){return top('SETTINGS','Clinic identity & doctors','These details appear on consent workflows and records.')+`<div class="two"><div class="card"><h2>Clinic profile</h2>${ctx.logo?`<img class="logo-preview" src="${ctx.logo}">`:''}${ctx.role==='owner'?`<form class="form" id="cf"><label>Clinic logo<input id="lf" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Clinic name<input id="cn" value="${e(ctx.clinic.name)}" required></label><div class="two"><label>City<input id="cc" value="${e(ctx.clinic.city||'')}"></label><label>Phone<input id="cp" value="${e(ctx.clinic.consent_phone||'')}"></label></div><label>Address<textarea id="ca">${e(ctx.clinic.consent_address||'')}</textarea></label><label>Clinic email<input id="ce" type="email" value="${e(ctx.clinic.consent_email||'')}"></label><button class="primary">Save clinic profile</button></form>`:'<p class="muted">Only the owner can edit settings.</p>'}</div><div class="card"><h2>Doctors</h2><div class="list">${ctx.doctors.map(d=>`<div class="row"><div class="dot">${e(d.doctor_name.slice(0,1))}</div><div><b>${e(d.doctor_name)}</b><span>${e(d.registration_number||'No registration')} · ${e(d.email)}</span></div></div>`).join('')}</div>${ctx.role==='owner'?`<form class="form" id="df" style="margin-top:14px"><label>Doctor name<input id="dn" required></label><label>Registration number<input id="dr"></label><label>Email for signed PDFs<input id="de" type="email" required></label><button class="primary">Add doctor</button></form>`:''}</div></div><div class="card" style="margin-top:14px"><h2>Workspace users</h2>${ctx.members.map(m=>`<div class="row"><div class="dot">${e(m.display_name.slice(0,1))}</div><div><b>${e(m.display_name)}</b><span>${e(m.role)}</span></div><span class="badge">${m.active?'Active':'Inactive'}</span></div>`).join('')}</div>`}function newConsent(){const a=ctx.templates.filter(t=>t.approval_status==='approved');return top('NEW CONSENT','Patient & treatment','Enter the essentials, then hand the tablet to the patient.')+`<div class="card"><form class="form" id="nf"><div class="two"><label>Patient name<input id="pn" required></label><label>Mobile<input id="pm"></label></div><div class="two"><label>Date of birth<input id="pd" type="date"></label><label>Tooth number(s)<input id="pt" placeholder="e.g. 16, 17"></label></div><div class="two"><label>Treating doctor<select id="doc" required><option value="">Select doctor</option>${ctx.doctors.map(d=>`<option value="${d.id}">${e(d.doctor_name)}</option>`).join('')}</select></label><label>Consent template<select id="tpl" required><option value="">Select template</option>${a.map(t=>`<option value="${t.id}">${e(t.display_title)} · v${t.version}</option>`).join('')}</select></label></div><label>Procedure notes<input id="notes"></label><button class="primary">Review Consent →</button></form></div>`}function render(){shell(view==='dashboard'?dashboard():view==='records'?records():view==='templates'?templates():view==='audit'?audit():view==='settings'?settings():newConsent());bind()}function bind(){if(view==='dashboard')newBtn.onclick=()=>{view='new';render()};if(view==='records'){q.oninput=x=>{const v=x.target.value.toLowerCase();rb.innerHTML=recordRows(ctx.records.filter(r=>`${r.patient_name_snapshot} ${r.consent_number} ${r.doctor_name_snapshot} ${r.procedure_name_snapshot}`.toLowerCase().includes(v)));bindRec()};bindRec()}if(view==='templates')bindTpl();if(view==='settings')bindSet();if(view==='new')nf.onsubmit=review}function bindRec(){document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>pdf(b.dataset.pdf));document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>mail(b.dataset.mail))}async function pdf(id){const r=ctx.records.find(x=>x.id===id);if(!r?.pdf_storage_path)return alert('No stored PDF.');const{data,error}=await s.storage.from('dm-consent-documents').download(r.pdf_storage_path);if(error)return alert(error.message);const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=r.consent_number+'.pdf';a.click()}async function mail(id){const{error}=await s.functions.invoke('consent-email',{body:{consentId:id}});alert(error?'Email not sent: '+error.message:'Email sent.');ctx=await load();render()}function bindTpl(){if(nt)nt.onclick=()=>formTpl();document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>approve(b.dataset.ap));document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>formTpl(b.dataset.ver))}function formTpl(id=''){const o=ctx.templates.find(x=>x.id===id);tf.innerHTML=`<div class="card" style="margin-bottom:13px"><form class="form" id="tform"><label>Template name<input id="tt" required value="${e(o?.display_title||'')}"></label><label>Procedure key<input id="tk" required value="${e(o?.procedure_key||'')}" ${o?'readonly':''}></label><label>Consent wording<textarea id="tx" rows="8" minlength="40" required>${e(o?.consent_text||'')}</textarea></label><button class="primary">${o?'Create new version':'Create template'}</button></form></div>`;tform.onsubmit=async ev=>{ev.preventDefault();const{error}=await s.from('dm_consent_templates').insert({clinic_id:ctx.clinicId,source_template_id:o?(o.source_template_id||o.id):null,procedure_key:tk.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_'),display_title:tt.value.trim(),consent_text:tx.value.trim(),locale:'en-IN',version:o?o.version+1:1,approval_status:'needs_review',active:true,created_by:session.user.id});if(error)return alert(error.message);ctx=await load();render()}}async function approve(id){const t=ctx.templates.find(x=>x.id===id);let error;if(t.clinic_id===ctx.clinicId)({error}=await s.from('dm_consent_templates').update({approval_status:'approved'}).eq('id',id));else({error}=await s.from('dm_consent_templates').insert({clinic_id:ctx.clinicId,source_template_id:t.id,procedure_key:t.procedure_key,display_title:t.display_title,consent_text:t.consent_text,locale:t.locale,version:1,approval_status:'approved',active:true,created_by:session.user.id}));if(error)return alert(error.message);ctx=await load();render()}function bindSet(){if(cf)cf.onsubmit=saveClinic;if(df)df.onsubmit=saveDoc}async function saveClinic(ev){ev.preventDefault();let{error}=await s.from('dm_clinics').update({name:cn.value.trim(),city:cc.value.trim()||null,consent_phone:cp.value.trim()||null,consent_address:ca.value.trim()||null,consent_email:ce.value.trim().toLowerCase()||null}).eq('id',ctx.clinicId);if(error)return alert(error.message);const f=lf.files?.[0];if(f){const p=`${ctx.clinicId}/clinic-logo.${(f.name.split('.').pop()||'png')}`;const u=await s.storage.from('dm-consent-branding').upload(p,f,{upsert:true,contentType:f.type});if(u.error)return alert(u.error.message);await s.from('dm_clinics').update({consent_logo_path:p}).eq('id',ctx.clinicId)}ctx=await load();render()}async function saveDoc(ev){ev.preventDefault();const{error}=await s.from('dm_consent_doctor_settings').insert({clinic_id:ctx.clinicId,doctor_name:dn.value.trim(),registration_number:dr.value.trim()||null,email:de.value.trim().toLowerCase(),active:true});if(error)return alert(error.message);ctx=await load();render()}function review(ev){ev.preventDefault();const d=ctx.doctors.find(x=>x.id===doc.value),t=ctx.templates.find(x=>x.id===tpl.value);window.pending={patient:pn.value.trim(),mobile:pm.value.trim(),dob:pd.value,tooth:pt.value.trim(),notes:notes.value.trim(),doctor:d,template:t};shell(`<div class="card" style="max-width:780px;margin:auto"><p class="kicker">PATIENT REVIEW</p><h1>${e(t.display_title)}</h1><p><b>${e(ctx.clinic.name)}</b><br>${e(pending.patient)} · ${e(d.doctor_name)}${pending.tooth?' · Tooth '+e(pending.tooth):''}</p><p class="muted" style="line-height:1.65">${e(t.consent_text)}</p><label><input id="a1" type="checkbox"> I have read and understood the information above.</label><br><br><label><input id="a2" type="checkbox"> I have had an opportunity to ask questions.</label><div class="actions" style="margin-top:18px"><button class="secondary" id="bk">Back</button><button class="primary" id="sg">Continue to Sign</button></div></div>`);bk.onclick=()=>{view='new';render()};sg.onclick=()=>{if(!a1.checked||!a2.checked)return alert('Please confirm both acknowledgements.');sign()}}function sign(){shell(`<div class="card" style="max-width:780px;margin:auto"><p class="kicker">PATIENT SIGNATURE</p><h1>Please sign below</h1><p class="muted">Use your finger or stylus.</p><canvas id="cv" class="canvas"></canvas><div class="actions" style="margin-top:14px"><button class="secondary" id="cl">Clear</button><button class="primary" id="sb">Accept & Submit</button></div></div>`);const c=cv,g=c.getContext('2d'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;g.scale(d,d);g.lineWidth=2;g.lineCap='round';g.strokeStyle='#17345a';drawn=[];const p=x=>{const r=c.getBoundingClientRect();return{x:x.clientX-r.left,y:x.clientY-r.top}};c.onpointerdown=x=>{drawing=true;const q=p(x);drawn.push([q]);g.beginPath();g.moveTo(q.x,q.y)};c.onpointermove=x=>{if(!drawing)return;const q=p(x);drawn.at(-1).push(q);g.lineTo(q.x,q.y);g.stroke()};c.onpointerup=()=>drawing=false;cl.onclick=()=>{g.clearRect(0,0,c.width,c.height);drawn=[]};sb.onclick=()=>submit(c)}function makePdf(text){const safe=x=>String(x).replace(/[()\\]/g,' ');let stream=`BT /F1 16 Tf 50 790 Td (DentMemo Consent) Tj ET\nBT /F1 11 Tf 50 765 Td (${safe(ctx.clinic.name)}) Tj ET\nBT /F1 13 Tf 50 735 Td (${safe(pending.template.display_title)}) Tj ET\nBT /F1 9 Tf 50 705 Td (Patient: ${safe(pending.patient)}) Tj ET\nBT /F1 9 Tf 50 686 Td (Doctor: ${safe(pending.doctor.doctor_name)}) Tj ET\nBT /F1 9 Tf 50 667 Td (Tooth: ${safe(pending.tooth||'-')}) Tj ET\nBT /F1 9 Tf 50 630 Td (${safe(text).slice(0,350)}) Tj ET\nBT /F1 8 Tf 50 60 Td (Signed electronically using DentMemo Consent) Tj ET\n`;const o=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',`<< /Length ${stream.length} >>\nstream\n${stream}endstream`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];let p='%PDF-1.4\n',offs=[0];o.forEach((x,i)=>{offs.push(p.length);p+=`${i+1} 0 obj\n${x}\nendobj\n`});const xr=p.length;p+=`xref\n0 ${o.length+1}\n0000000000 65535 f \n`;offs.slice(1).forEach(x=>p+=String(x).padStart(10,'0')+' 00000 n \n');p+=`trailer\n<< /Size ${o.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;return new TextEncoder().encode(p)}async function submit(c){if(!drawn.length)return alert('Please sign first.');sb.disabled=true;const id=crypto.randomUUID(),number=`DC-${new Date().getFullYear()}-${id.slice(0,8).toUpperCase()}`,at=new Date(),bytes=makePdf(pending.template.consent_text),path=`${ctx.clinicId}/${id}/signed-consent.pdf`;const up=await s.storage.from('dm-consent-documents').upload(path,new Blob([bytes],{type:'application/pdf'}),{contentType:'application/pdf'});if(up.error)return alert(up.error.message);const sig=drawn.map(st=>({points:st.map(q=>({x:q.x/c.clientWidth,y:q.y/c.clientHeight}))}));const{error}=await s.from('dm_consents').insert({id,clinic_id:ctx.clinicId,consent_number:number,template_id:pending.template.id,template_version:pending.template.version,patient_name_snapshot:pending.patient,patient_mobile_snapshot:pending.mobile||null,patient_dob_snapshot:pending.dob||null,doctor_setting_id:pending.doctor.id,doctor_name_snapshot:pending.doctor.doctor_name,doctor_registration_snapshot:pending.doctor.registration_number,doctor_email_snapshot:pending.doctor.email,procedure_key:pending.template.procedure_key,procedure_name_snapshot:pending.template.display_title,tooth_numbers:pending.tooth||null,procedure_notes:pending.notes||null,consent_title_snapshot:pending.template.display_title,consent_text_snapshot:pending.template.consent_text,locale:pending.template.locale||'en-IN',acknowledgements:['I have read and understood the information above.','I have had an opportunity to ask questions.'],signer_type:'patient',signer_name:pending.patient,signature_strokes:sig,status:'signed',signed_at:at.toISOString(),pdf_storage_path:path,email_status:'pending',created_by:session.user.id});if(error)return alert(error.message);const m=await s.functions.invoke('consent-email',{body:{consentId:id}});ctx=await load();shell(`<div class="card" style="max-width:650px;margin:auto;text-align:center;padding:42px"><div class="dot" style="margin:auto">✓</div><p class="kicker">CONSENT COMPLETED</p><h1>${e(number)}</h1><p>${m.error?'Signed and safely stored. Email delivery needs configuration or retry.':'Signed, stored and emailed.'}</p><button class="primary" id="done">Done</button></div>`);done.onclick=()=>{view='dashboard';render()}}s.auth.onAuthStateChange((_x,z)=>{session=z;if(!z)auth()});boot();</script></body></html>
